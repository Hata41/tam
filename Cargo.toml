[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.6"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/ComeBertrand/tam"
homepage = "https://github.com/ComeBertrand/tam"

[workspace.dependencies]
tam-proto = { path = "crates/tam-proto", version = "0.3.6" }
tam-daemon = { path = "crates/tam-daemon", version = "0.3.6" }
tam-worktree = { path = "crates/tam-worktree", version = "0.3.6" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "poll"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
ratatui = "0.29"
# use-dev-tty: level-triggered poll(2) source that never blocks on a tty
# drained by the attach relay (the default mio source does).
crossterm = { version = "0.28", features = ["use-dev-tty"] }
toml = "0.8"
dirs = "6"
colored = "3"
globset = "0.4"
vt100 = "0.15"
clap_complete = "4"
clap_mangen = "0.2"
